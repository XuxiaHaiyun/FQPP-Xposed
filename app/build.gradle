plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.xxhy.fqpp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xxhy.fqpp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.kotlinx.coroutines.android
    
    testImplementation libs.junit
    compileOnly files('libs/api-102.0.0.aar')
    implementation 'io.github.libxposed:service:101.0.0'
    implementation files('libs/joor-0.9.15.jar')
    implementation files('libs/nanohttpd-2.3.1.jar')
    implementation files('libs/gson-2.13.2.jar')
    implementation 'org.luckypray:dexkit:2.2.0'
}
